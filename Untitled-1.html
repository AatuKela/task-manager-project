<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    style.css
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Lisää uusi tehtävä">
            <button id="addBtn">Lisää</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Kaikki</button>
            <button class="filter-btn" data-filter="active">Kesken</button>
            <button class="filter-btn" data-filter="completed">Valmiit</button>
        </div>

        <ul id="taskList"></ul>

    </div>

    script.jsscript>

</body>
</html>
